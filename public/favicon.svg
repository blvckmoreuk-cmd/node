    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="55%" stop-color="#2f6fed" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#2f6fed" stop-opacity="0" />
        </radialGradient>
    </defs>
    <circle cx="64" cy="64" r="60" fill="url(#glow)" />
    <circle cx="64" cy="64" r="30" fill="#2f6fed" />
</svg>
